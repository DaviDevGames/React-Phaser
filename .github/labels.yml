# Definição de labels padronizadas para o repositório.
# Aplique com o script scripts/setup-labels.sh (requer GitHub CLI autenticado)
# ou com a ferramenta github-label-sync.

- name: "bug"
  color: "d73a4a"
  description: "Algo não está funcionando como esperado"
- name: "enhancement"
  color: "a2eeef"
  description: "Sugestão de melhoria em algo existente"
- name: "novo-conteudo"
  color: "0e8a16"
  description: "Proposta de novo exemplo, script ou jogo"
- name: "documentacao"
  color: "0075ca"
  description: "Melhorias ou correções na documentação"
- name: "duvida"
  color: "d876e3"
  description: "Pergunta sobre algum exemplo ou conceito"
- name: "triagem"
  color: "ededed"
  description: "Aguardando análise de um mantenedor"
- name: "good first issue"
  color: "7057ff"
  description: "Boa issue para quem está começando a contribuir"
- name: "help wanted"
  color: "008672"
  description: "Ajuda extra é bem-vinda"
- name: "dependencies"
  color: "0366d6"
  description: "Atualização de dependências (geralmente via Dependabot)"
- name: "ci"
  color: "fbca04"
  description: "Relacionado a GitHub Actions / integração contínua"
- name: "infraestrutura"
  color: "5319e7"
  description: "Templates, automações, configuração do repositório"
- name: "roadmap"
  color: "c5def5"
  description: "Planejado para uma versão futura"
- name: "em-andamento"
  color: "fef2c0"
  description: "Já está sendo trabalhado por alguém"
- name: "inativo"
  color: "cccccc"
  description: "Sem atividade recente (gerenciado pelo bot de stale)"
- name: "nao-marcar-stale"
  color: "cccccc"
  description: "Nunca deve ser fechado automaticamente por inatividade"
- name: "scripts"
  color: "bfd4f2"
  description: "Relacionado à pasta 02-Scripts"
- name: "jogos"
  color: "bfd4f2"
  description: "Relacionado à pasta 03-Jogos"
- name: "sprites-vfx-sounds"
  color: "bfd4f2"
  description: "Relacionado a sprites, VFX ou sons"
- name: "gdd"
  color: "bfd4f2"
  description: "Relacionado à pasta 09-gdd (Game Design Document)"
